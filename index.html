<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ForosRaiz - imageboard descentralizado sobre Nostr: publica, comparte y comenta en foros temáticos.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1a1b26">
  <link rel="canonical" href="https://eynorxix.github.io/tox-forum/">
  <title>ForosRaiz - imageboard minimalista</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="https://images.pexels.com/photos/38241066/pexels-photo-38241066.jpeg" fetchpriority="high">
</head>
<body>

  <!-- Barra superior -->
  <header id="topbar">
    <div class="inner">
      <div id="top-actions">
        <button id="my-profile-btn" type="button" class="my-profile-chip" title="Mi perfil">
          <span id="mp-avatar"></span>
          <span id="mp-label">Mi perfil</span>
        </button>
        <button id="top-colab-btn" type="button" class="top-btn" title="Colaboradores y seguidos">Colab</button>
        <button id="top-foros-btn" type="button" class="top-btn" title="Foros principales y de colaboradores">Foros</button>
        <button id="nav-home" type="button" class="top-btn" data-board="home" title="Inicio">Inicio</button>
        <button id="notif-btn" type="button" class="top-btn" data-board="notificaciones" title="Notificaciones">
          Notif <span class="notif-badge-nav" id="notif-badge" hidden>0</span>
        </button>
        <div id="theme-switch" title="Cambiar de tema de color">
          <div class="theme-opt" data-theme="dark" title="Tokyo Night (oscuro)">
            <button type="button" class="theme-dot theme-dot-dark" aria-label="Tema Tokyo Night (oscuro)"></button>
            <span class="dot-label">Tokyo Night</span>
          </div>
          <div class="theme-opt" data-theme="mono" title="Oscuro con blanco">
            <button type="button" class="theme-dot theme-dot-mono" aria-label="Tema oscuro con blanco"></button>
            <span class="dot-label">Dark y blanco</span>
          </div>
          <div class="theme-opt" data-theme="light" title="Tokyo claro">
            <button type="button" class="theme-dot theme-dot-light" aria-label="Tema Tokyo claro"></button>
            <span class="dot-label">Tokyo Light</span>
          </div>
        </div>
      </div>
      <nav id="board-nav"></nav>
    </div>
  </header>

  <!-- Contenido dinámico -->
  <main id="content"></main>

  <footer id="footer">
    <p>ForosRaiz &mdash; imageboard minimalista &middot; los &uacute;nicos que pueden publicar son los usuarios registrados</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
